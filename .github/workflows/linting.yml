name: linting
on: [push]
jobs:
  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - name: PHP-CS-Fixer
      uses: docker://oskarstark/php-cs-fixer-ga
      with:
        args: --config=.project.php_cs --diff --dry-run

  composer:
    name: "Composer: TYPO3 ${{ matrix.typo3 }} / PHP ${{ matrix.php }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - typo3: "^12.4"
            php: "8.1"
          - typo3: "^13"
            php: "8.2"
    steps:
      - uses: actions/checkout@master
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Require TYPO3 version
        run: composer require --no-update typo3/cms-core:${{ matrix.typo3 }}
      - name: Install dependencies
        run: composer update --prefer-dist --no-progress
